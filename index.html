<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위수협의</title>
  <script src="js/theme.js"></script>
  <style>
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --surface-2: #171717;
      --topbar: rgba(5,5,5,0.94);
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.22);
      --text: #f5f5f5;
      --muted: #bbbbbb;
      --faint: #8a8a8a;
      --green: #2fe27b;
      --shadow: 0 12px 30px rgba(0,0,0,0.28);
      --font: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    :root[data-theme="light"] {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #f0f1f3;
      --topbar: rgba(243,244,246,0.94);
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.24);
      --text: #15171a;
      --muted: #4b5058;
      --faint: #6d727a;
      --green: #0b8f48;
      --shadow: 0 6px 18px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.5; }
    button { font:inherit; color:inherit; cursor:pointer; }
    header {
      position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:10px 16px; background:var(--topbar); border-bottom:1px solid var(--border); backdrop-filter:blur(10px);
    }
    h1 { margin:0; font-size:20px; font-weight:800; }
    .theme-btn { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--surface); border:1px solid var(--border-strong); }
    main { flex:1; width:100%; max-width:880px; margin:0 auto; padding:24px 16px 40px; }
    .server { margin-bottom:28px; }
    .server h2 { margin:0 0 12px; font-size:16px; font-weight:700; color:var(--muted); }
    .season-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap:12px; }
    .season-card {
      display:block; padding:18px; text-decoration:none; color:inherit;
      background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
      transition:border-color .15s, transform .15s;
    }
    .season-card:hover, .season-card:focus-visible { border-color:var(--border-strong); transform:translateY(-1px); }
    .season-card.live { border-color:var(--green); }
    .season-title { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:18px; font-weight:800; }
    .season-date { margin-top:6px; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
    .badge { flex:0 0 auto; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--surface-2); color:var(--faint); }
    .badge.live { color:var(--green); border-color:var(--green); }
    footer { padding:12px 16px 24px; text-align:center; font-size:12px; color:var(--faint); }
  </style>
</head>
<body>
  <header>
    <h1>위수협의</h1>
    <div data-theme-slot></div>
  </header>
  <main>
    <section class="server">
      <h2>한섭</h2>
      <div class="season-list">
        <a class="season-card" href="season3kr.html" data-start="2026-08-20" data-end="2026-10-01">
          <div class="season-title"><span>위수 협의: 맹약</span><span class="badge"></span></div>
          <div class="season-date">2026-08-20 ~ 2026-10-01</div>
        </a>
        <a class="season-card" href="season2kr.html" data-start="2026-04-28" data-end="2026-05-25">
          <div class="season-title"><span>위수 협의: 맹약</span><span class="badge"></span></div>
          <div class="season-date">2026-04-28 ~ 2026-05-25</div>
        </a>
      </div>
    </section>
    <section class="server">
      <h2>중섭</h2>
      <div class="season-list">
        <!-- 종료일 미정(게임 데이터상 무기한) -->
        <a class="season-card" href="act3autochess.html" data-start="2026-11-08" data-end="9999-12-31">
          <div class="season-title"><span>위수 협의: 규정</span><span class="badge"></span></div>
          <div class="season-date">2026-11-08 ~</div>
        </a>
        <a class="season-card" href="season3.html" data-start="2026-03-14" data-end="2026-04-25">
          <div class="season-title"><span>위수 협의: 맹약/하반기</span><span class="badge"></span></div>
          <div class="season-date">2026-03-14 ~ 2026-04-25</div>
        </a>
        <a class="season-card" href="season2.html" data-start="2025-11-14" data-end="2025-12-12">
          <div class="season-title"><span>위수 협의: 맹약/상반기</span><span class="badge"></span></div>
          <div class="season-date">2025-11-14 ~ 2025-12-12</div>
        </a>
      </div>
    </section>
  </main>
  <footer>본 사이트의 모든 명일방주 관련 콘텐츠는 Hypergryph의 저작물입니다.</footer>
  <script>
    // 날짜로 시즌 상태를 표시한다
    var now = new Date();
    var today = new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    document.querySelectorAll('.season-card').forEach(function (card) {
      var badge = card.querySelector('.badge');
      var live = today >= card.dataset.start && today <= card.dataset.end;
      var soon = today < card.dataset.start;
      badge.textContent = live ? '진행 중' : soon ? '예정' : '종료';
      if (live) {
        card.classList.add('live');
        badge.classList.add('live');
      }
    });
  </script>
</body>
</html>
